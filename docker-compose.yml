name: european-retail-intelligence-platform

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Set ANALYTICS_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d analytics_db"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ./backend
      target: production
    environment:
      DATABASE_URL: postgresql://analytics_app:${APP_DB_PASSWORD}@db:5432/analytics_db
    command: [sh, -c, "alembic upgrade head && python -m app.scripts.apply_grants"]
    depends_on:
      db:
        condition: service_healthy
  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://analytics_app:${APP_DB_PASSWORD}@db:5432/analytics_db
      ANALYTICS_DATABASE_URL: postgresql://analytics_reader:${ANALYTICS_DB_PASSWORD}@db:5432/analytics_db
      AI_PROVIDER: ${AI_PROVIDER:-foundry_local}
      AI_MODEL: ${AI_MODEL:-phi-4-mini}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-120}
      MAX_SQL_ROWS: ${MAX_SQL_ROWS:-100}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-5000}
      MAX_RESULT_BYTES: ${MAX_RESULT_BYTES:-200000}
      ANALYSIS_MAX_ROWS: ${ANALYSIS_MAX_ROWS:-30}
      ANALYSIS_MAX_BYTES: ${ANALYSIS_MAX_BYTES:-12000}
      QUERY_HISTORY_LIMIT: ${QUERY_HISTORY_LIMIT:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_ENV: production
      API_ROOT_PATH: /api
    depends_on:
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
  eurostat-data:
    profiles: [eurostat-data]
    build:
      context: ./backend
      target: production
    environment:
      DATABASE_URL: postgresql://analytics_app:${APP_DB_PASSWORD}@db:5432/analytics_db
    command: [python, -m, app.scripts.import_market]
    depends_on:
      migrate:
        condition: service_completed_successfully
  price-cost-sync:
    profiles: [price-cost-sync]
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    environment:
      DATABASE_URL: postgresql://analytics_app:${APP_DB_PASSWORD}@db:5432/analytics_db
      PRICE_COST_ARTIFACT_ROOT: /var/lib/price-cost
      SYNC_FUEL_INTERVAL_SECONDS: ${SYNC_FUEL_INTERVAL_SECONDS:-604800}
      SYNC_HICP_INTERVAL_SECONDS: ${SYNC_HICP_INTERVAL_SECONDS:-86400}
      SYNC_ECB_INTERVAL_SECONDS: ${SYNC_ECB_INTERVAL_SECONDS:-21600}
      SYNC_BACKFILL_INTERVAL_DAYS: ${SYNC_BACKFILL_INTERVAL_DAYS:-30}
      SYNC_OVERLAP_DAYS: ${SYNC_OVERLAP_DAYS:-400}
      SYNC_HICP_GEOS: ${SYNC_HICP_GEOS:-EU27_2020,AT,BE,BG,HR,CY,CZ,DK,EE,FI,FR,DE,EL,HU,IE,IT,LV,LT,LU,MT,NL,PL,PT,RO,SK,SI,ES,SE}
      SYNC_HICP_CATEGORIES: ${SYNC_HICP_CATEGORIES:-TOTAL,CP01,CP03,CP04,CP06,CP07,CP11}
      SYNC_HICP_UNITS: ${SYNC_HICP_UNITS:-I25,RCH_M,RCH_A}
      SYNC_ECB_CURRENCIES: ${SYNC_ECB_CURRENCIES:-CZK,DKK,HUF,PLN,RON,SEK,GBP,CHF,USD}
    command: [python, -m, app.scripts.sync_price_cost, schedule]
    volumes:
      - price_cost_raw:/var/lib/price-cost
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  price_cost_raw:
  postgres_data:
