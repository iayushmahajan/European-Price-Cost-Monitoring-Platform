services:
  backend-tests:
    build:
      context: ./backend
      target: test
    image: european-retail-intelligence-platform-backend-m7-test
    environment:
      TEST_DATABASE_URL: postgresql://analytics_app:${APP_DB_PASSWORD}@db:5432/price_cost_m7_test
      TEST_ANALYTICS_DATABASE_URL: postgresql://analytics_reader:${ANALYTICS_DB_PASSWORD}@db:5432/price_cost_m7_test
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/price_cost_m7_test
      TEST_ALLOW_RESET: '1'
    command: [python, -m, pytest, -q]
